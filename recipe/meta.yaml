{% set name = "editor" %}
{% set version = "1.8.0" %}

package:
  name: {{ name }}
  version: {{ version }}

source:
  url: https://pypi.org/packages/source/{{ name[0] }}/{{ name }}/{{ name }}-{{ version }}.tar.gz
  sha256: b07e1bbcb8b33f05c2e6ed3ce77ee9756354ada840a18aad7c0536d967fe4c0b

build:
  script: {{ PYTHON }} -m pip install . -vv --no-deps --no-build-isolation
  number: 0
  skip: true  # [py<310]

requirements:
  host:
    - python
    - hatchling
    - pip
  run:
    - python
    - runs
    - xmod

test:
  imports:
    - editor
  commands:
    - pip check
    - python -c "from importlib.metadata import version; assert(version('{{ name }}')=='{{ version }}')"
    # Cannot run upstream tests due to lack of 'tdir' package
    #- pytest -vv test_editor.py
  requires:
    - pip

about:
  home: https://github.com/rec/editor
  summary: Open the default text editor
  description: Open the default text editor.
  license: MIT
  license_family: MIT
  license_file: LICENSE
  dev_url: https://github.com/rec/editor
  doc_url: https://rec.github.io/editor

extra:
  recipe-maintainers:
    - nicornk
